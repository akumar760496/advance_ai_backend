events {

}

http {
    upstream backend{
        server server1:7000;
        server server2:7000;
        server server3:7000;
        #server server4:7000;
        #keepalive 32;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
